name: Kernel Driver Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-arm64-driver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Linux Build Dependencies & ARM64 Cross-Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu crossbuild-essential-arm64 linux-headers-arm64

      - name: Compile Kernel Module for ARM64
        run: |
          cd driver
          ARM64_KDIR=$(ls -d /usr/src/linux-headers-*-arm64 | head -n 1)
          echo "Using ARM64 Kernel Headers at: $ARM64_KDIR"
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR=$ARM64_KDIR